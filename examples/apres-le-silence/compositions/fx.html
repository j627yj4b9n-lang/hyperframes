<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #fx-grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0.16; mix-blend-mode: overlay; }
    #fx-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%); }
    #fx-tint { position: absolute; inset: 0; background: rgba(10, 30, 40, 0.12); mix-blend-mode: color; }
  </style>
  <div id="root" data-composition-id="fx" data-width="1080" data-height="1920" data-duration="60">
    <canvas id="fx-grain" width="360" height="640"></canvas>
    <div id="fx-vig"></div>
    <div id="fx-tint"></div>
  </div>
  <script>
    (function () {
      const N = window.Noir;
      const ctx = document.getElementById("fx-grain").getContext("2d");
      const st = { t: 0 };
      function draw(t) {
        const f = Math.floor(t * 24);
        const tile = N.grain(f);
        const ox = Math.floor(N.hash(f) * 120);
        const oy = Math.floor(N.hash(f + 0.5) * 200);
        ctx.drawImage(tile, -ox, -oy);
        ctx.drawImage(tile, 360 - ox, -oy);
        ctx.drawImage(tile, -ox, 640 - oy);
        ctx.drawImage(tile, 360 - ox, 640 - oy);
      }
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: 60, duration: 60, ease: "none", onUpdate: () => draw(st.t) }, 0);
      draw(0);
      window.__timelines["fx"] = tl;
    })();
  </script>
</template>
